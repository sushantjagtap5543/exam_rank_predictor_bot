services:
  - type: web
    name: exam-rankers-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.bot
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: ADMIN_API_KEY
        sync: false
      - key: DOWNLOAD_SECRET_KEY
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        sync: false
      - key: DATA_DIR
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PAID_CHANNEL_ID
        sync: false
      - key: PAID_CHANNEL_LINK
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_LINK
        sync: false
      - key: YOUTUBE_BUTTON_TEXT
        sync: false
      - key: SELF_PING_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
