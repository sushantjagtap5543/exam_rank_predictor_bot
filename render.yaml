services:
  - type: web
    name: exam-rankers-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.bot
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: ADMIN_API_KEY
        sync: false
      - key: DOWNLOAD_SECRET_KEY
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        sync: false
      - key: DATA_DIR
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PAID_CHANNEL_ID
        sync: false
      - key: PAID_CHANNEL_LINK
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_LINK
        sync: false
      - key: YOUTUBE_BUTTON_TEXT
        sync: false
      - key: SELF_PING_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: STORE_WEB_URL
        value: "https://exam-rank-predictor-bot.onrender.com"
      - key: OPENROUTER_MODEL
        value: "nvidia/nemotron-3.5-lightning:free"

  # ----------------------------------------------------------------------------
  # Service 2: Official OpenClaw Gateway (Dedicated Separate Link & Web Service)
  # Official Source: https://github.com/openclaw/openclaw.git
  # ----------------------------------------------------------------------------
  - type: web
    name: openclaw-gateway
    env: image
    image:
      url: ghcr.io/openclaw/openclaw:latest
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_GATEWAY_BIND
        value: "0.0.0.0"
